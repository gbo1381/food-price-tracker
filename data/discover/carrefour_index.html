    <style>body > :not(.picker),
body > :not(.picker) * {
    transition: all .15s;
}

* {
    direction: rtl;
    font-family: Arial, Helvetica, sans-serif;
}

*:focus {
    outline: none;
}

body {
    width: 100%;
    margin: 0px;
}

.hidden {
    display: none;
}

.container {
    box-sizing: border-box;
    width: 100%;
    padding: 0px 120px;
    padding-top: 40px;
    padding-bottom: 40px;
}

h1 {
    text-align: center;
}

h2, h3, h4, h5 {
    font-weight: normal;
}

.centerTxt {
    text-align: center;
}

.companyLogo {
    display: inherit;
    text-align: center;
    margin: 0 auto;
    height: auto;
    width: 200px;
    max-width: 90%;
}

.parentDirDiv {
    display: inline-block;
    font-size: large;
    margin: 10px 0px;
    text-decoration: underline;
}

.parentDirDiv:hover {
    cursor: pointer;
    opacity: .65;
}

.fileDiv {
    transform-origin: top center;
    position: relative;
    display: grid;
    padding: 10px 15px;
    border: none;
    font-size: large;
    grid-template-columns: 1fr 1fr .75fr .2fr;
}

.fileDiv:nth-of-type(odd) {
    background-color: #efefef;
}

.fileDiv:first-of-type {
    border: 1px solid #ccc;
    color: #555;
}

.fileDiv:first-of-type .filterLink {
    color: royalblue;
    text-decoration: underline;
}

.fileDiv:first-of-type span[filter="m"] {
    cursor: pointer;
}

.fileDiv:not(:first-of-type) {
    animation: slide .3s ease 1;
}

.fileDiv:not(:first-of-type):hover {
    opacity: .7;
}

.fileDiv:not(:first-of-type) .fileSize {
    text-align: right;
    direction: ltr;
}

.fileDiv .downloadBtn {
    text-decoration: none;
    color: inherit;
}

.fileDiv .fa-folder {
    color: orange;
}

.input {
    margin: 10px 0px;
    padding: 10px 20px;
    font-size: large;
    color: #333;
    background: #efefef;
    border: none;
    border-radius: 8px;
    max-width: 30%;
    box-sizing: border-box;
}

.paginationDiv {
    display: none;
    margin-top: 40px;
    text-align: center;
}

.paginationBtn {
    box-sizing: border-box;
    height: 30px;
    width: 30px;
    text-align: center;
    background-color: #eee;
    /*color: #16a06e;*/
    
    border: none;
    border-radius: 5px;
    font-size: small;
}

.paginationNav {
    background-color: #077ccc;
    color: #fff;
}

.paginationPages {
    display: inline-block;
}

.paginationBtn_disabled {
    background-color: #f6f6f6;
    color: #ededed;
    pointer-events: none;
}

.paginationBtn_selected {
    background-color: #077ccc;
    color: #fff;
}

.paginationBtn:hover {
    cursor: pointer;
    opacity: .6;
}

.paginationTxt {
    font-weight: bold;
}

.footer {
    position: fixed;
    bottom: 0;
    text-align: center;
    width: 100%;
    padding: 10px 0px;
    /*background-color: #02b48b;*/
     background-color: #ececec; 
    color: #333;
    border-top: 1px solid #ccc;
    font-size: small;
}

.footer p {
    font-weight: bold;
    margin: 0px;
}

.footer a {
    /*color: #98ffd4;*/
    color: #16a06e;
    font-weight: bold;
    text-decoration: none;
}

@keyframes slide {
    0% {transform: scaleY(0); transform-origin: top center;}
    100% {transform: scaleY(1); transform-origin: top center;}
}

@media only screen and (max-width: 1500px) {
    .container {
        padding: 40px 10px;
    }
    
    .fileDiv, .input {
        font-size: medium;
    }
}

@media only screen and (max-width: 1000px) {
    .fileDiv {
        font-size: small;
        grid-template-columns: 1fr .75fr .2fr;
    }
    
    h1 {
        font-size: large;
    }
    
    .input {
        font-size: small;
    }
    
    .fileDiv .fileSize, .first_row_fileSize {
        display: none;
    }
}

/* Picker Style START */
.picker-close {
    right: auto;
    left: 0;
}
/* Picker Style END */</style>

<script>async function getFileInfo(url) {
  try {
    // Call your PHP proxy
    const proxyUrl = `file_info.php?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    return data;
  } catch (err) {
    console.error('Error fetching file info:', err);
    return null;
  }
}

let filtered_files = files, sorted_files = filtered_files;

})

function sortBranchSelectOptions() {
    var $select = $('#branch_filter');

    var $options = $select.find('option');

    $options.sort(function (a, b) {
        var numA = parseInt($(a).text().split('-')[0].trim(), 10);
        var numB = parseInt($(b).text().split('-')[0].trim(), 10);
        return numA - numB;
    });

    $select.empty().append($options);
}

function filterFiles(showFiles = false) {
    filtered_files = files;
    currentPage = 0;
    saveOnSessionStorage();
    makeAllFilters();
    updatePaginationInfo();
    sorted_files = filtered_files;
    if (showFiles) {
        displayFiles();
    }
}

function saveOnSessionStorage() {
    let branchValue = $('#branch_filter').val();
    let categoryValue = $('#category_filter').val();

    if (branchValue) {
        sessionStorage.setItem('branch', branchValue)
    } else {
        sessionStorage.removeItem('branch')
    }
    
    if (categoryValue) {
        sessionStorage.setItem('category', categoryValue)
    } else {
        sessionStorage.removeItem('category')
    }
}

function getLastSessFilters() {
    if (sessionStorage.getItem('branch')) {
        $(`#branch_filter option[value="${sessionStorage.getItem('branch')}"]`).prop('selected', true);
    }

    if (sessionStorage.getItem('category')) {
        $(`#category_filter option[value="${sessionStorage.getItem('category')}"]`).prop('selected', true);
    }
}

function makeAllFilters() {
    filtered_files = filtered_files.filter((file_info) => {
        
        const filename = file_info.name;
        return (
            isBranchFiltered(filename) 
            && isCategoryFiltered(filename) 
            && isFreeSearchFiltered(filename)
        );
    });
}

function isFreeSearchFiltered(filename = '') {
    let value = $('#free_search_filter').val();
    if (value) {
        value = value.trim();
    }

    let filtered = false;
    if (value) {
        filtered = (filename.includes(value));
    } else {
        filtered = true;
    }

    return filtered;
}

function isBranchFiltered(filename = '') {
    const branch_select = $('#branch_filter');
    const value = branch_select.val();

    let filtered = false;
    if (value && filename) {
        // console.log('Filtering to branch: '+value)
        const splitted_filename = filename.split('-');
        let branch = 0;
        if (splitted_filename.length == 3) { // Old Structure
            branch = splitted_filename[1];
            // console.log(branch);
        } else if (splitted_filename.length == 5) { // New Structure
            branch = splitted_filename[2];
            // console.log(branch);
        }

        filtered = (parseInt(branch) == parseInt(value));
    } else {
        filtered = true;
    }

    return filtered;
}

function hasExactWord(str, word) {
  const regex = new RegExp(`\\b${word}(?![a-zA-Z])`);
  return regex.test(str);
}

function isCategoryFiltered(filename = '') {
    const category_select = $('#category_filter');
    const value = category_select.val();

    let filtered = false;

    if (value && filename) {
        // console.log('Filtering to Category: '+value);
        filtered = hasExactWord(filename, value);
    } else {
        filtered = true;
    }

    return filtered;
}

function updatePaginationInfo() {
    totalPages = Math.ceil(filtered_files.length / rowsPerPage);
}

function clearFiles() {
    $('.filesDiv .fileDiv:not(:first-of-type)').remove();
}

async function displayFiles() {
    clearFiles();
    updatePaginationHTML();
    let html = '';
    for (let i = currentPage*rowsPerPage; i < currentPage*rowsPerPage+rowsPerPage; i++) {
        if (sorted_files[i]) {
            const file_info = sorted_files[i];
            const filename = file_info.name;
            const file_link = window.location.origin+'/'+path+'/'+filename;

            // const fileInfo = await getFileInfo(file_link);
            // console.log(fileInfo)

            html += `
            <div class="fileDiv" id="${i}">
                <a class="fileNameA">
                    ${zipIcon}
                    <span class="fileName">${filename}</span>
                </a>
                <span class="modified">${file_info.modified}</span>
                <span class="fileSize">${formatBytes(file_info.size)}</span>
                <a href="${file_link}" class="downloadBtn">
                    ${downloadIcon}
                </a>
            </div>
            `;
        } else {
            break;
        }
    }

    if (html != '') {
        $('.filesDiv .errMsg').fadeOut(0);
        $('.filesDiv').append(html);
    } else {
        $('.filesDiv .errMsg').fadeIn(0);
        $('.filesDiv .errMsg').html('לא נמצאו קבצים!');
    }
}

function updatePaginationHTML() {
    $('.paginationPages').empty();
    $('.paginationCurrent').html(currentPage+1);
    $('.paginationTotal').html(totalPages)

    let counter = 0;

    $('.paginationNav[data-action="next"], .paginationNav[data-action="last"], .paginationNav[data-action="prev"], .paginationNav[data-action="first"]').removeClass('paginationBtn_disabled')

    if (currentPage == totalPages-1) { // last
        for (let i = totalPages-1; i >= 0; i--) {
            if (counter >= 3) break;
            const page_selected = (i == currentPage) ? 'paginationBtn_selected' : '';
            $('.paginationPages').prepend(`
                <button class="paginationBtn ${page_selected}" onclick="changePage(${i})" data-page="${i}">${i+1}</button>    
            `);
            counter++;
        }

        $('.paginationNav[data-action="next"]').addClass('paginationBtn_disabled')
        $('.paginationNav[data-action="last"]').addClass('paginationBtn_disabled')

        if (currentPage == 0) {
            $('.paginationNav[data-action="prev"]').addClass('paginationBtn_disabled')
            $('.paginationNav[data-action="first"]').addClass('paginationBtn_disabled')
        }
    } else if (currentPage == 0) { // first
        console.log('HERE 0!!!')
        for (let i = 0; i < totalPages; i++) {
            if (counter >= 3) break;
            const page_selected = (i == currentPage) ? 'paginationBtn_selected' : '';
            $('.paginationPages').append(`
                <button class="paginationBtn ${page_selected}" onclick="changePage(${i})" data-page="${i}">${i+1}</button>    
            `);
            counter++;
        }

        $('.paginationNav[data-action="prev"]').addClass('paginationBtn_disabled')
        $('.paginationNav[data-action="first"]').addClass('paginationBtn_disabled')

        if (totalPages == 0) {
            $('.paginationNav[data-action="next"]').addClass('paginationBtn_disabled')
            $('.paginationNav[data-action="last"]').addClass('paginationBtn_disabled')
        }
    } else {
        console.log('Here!!!')
        let firstBoxPage = currentPage-1;
        for (let i = firstBoxPage; i < totalPages; i++) {
            if (counter >= 3) break;
            const page_selected = (i == currentPage) ? 'paginationBtn_selected' : '';
            $('.paginationPages').append(`
                <button class="paginationBtn ${page_selected}" onclick="changePage(${i})" data-page="${i}">${i+1}</button>    
            `);
            counter++;
        }
    }
}

function nextPage() {
    currentPage = (currentPage+1 >= totalPages) ? currentPage : currentPage+1;
    displayFiles();
}

function prevPage() {
    currentPage = (currentPage-1 < 0) ? currentPage : currentPage-1;
    displayFiles();
}

function firstPage() {
    currentPage = 0;
    displayFiles();
}

function lastPage() {
    currentPage = totalPages-1;
    displayFiles();
}

function changePage(pageNum) {
    if (pageNum < totalPages && pageNum >= 0) {
        currentPage = pageNum;
        displayFiles();
    }
}

// 				text = trans.months.full.find(x => x.en === text).he;
// 			}
			return String(text);
		},
		pick: (data) => {
			let picker_year = data.target.picker.data.year.current;
			let picker_month = data.target.picker.data.month.current;
			let picker_day = data.target.picker.data.day.current;
			let value_month = picker_month+1;
			value_month = (value_month < 10) ? '0'+value_month : value_month;
      picker_day = (picker_day < 10) ? '0'+picker_day : picker_day;
			const newDate = `${picker_year}${value_month}${picker_day}`;
			changeDate(newDate);
		}
	});
}

function changeDate(date) {
    const allParams = getSearchParams();
    allParams[`date`] = date;
    let paramsEncoded = replaceURLParams($.param(allParams));
    window.location.replace(`/?${paramsEncoded}`)
}

function getSearchParams(k) {
    var p = {};
    location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(s, k, v) {
        p[k] = v
    })
    return k ? p[k] : p;
}

function replaceURLParams(params) {
    let paramsEncoded = params.replaceAll('%252F', '/');
    paramsEncoded = params.replaceAll('%2F', '/');
    return paramsEncoded;
}

function formatBytes(bytes, decimals = 2) {
    if (bytes === 0) return '0 Bytes';

    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];

    const i = Math.floor(Math.log(bytes) / Math.log(k));

    return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
}

let current_modified_state = 0;
function sort_modified(showFiles = false) {
    const modified_states = ['asc', 'desc'];
    current_modified_state++;

    if (current_modified_state === modified_states.length) {
        current_modified_state = 0;
    }

    $('.modifiedIcon').removeClass('hidden')
    $('.modifiedIcon').removeClass('fa-arrow-down')
    $('.modifiedIcon').removeClass('fa-arrow-up')
    switch (modified_states[current_modified_state]) {
        case 'asc':
            $('.modifiedIcon').addClass('fa-arrow-up');
            sorted_files = [...filtered_files].sort((a, b) => {
                const dateA = parseModifiedDate(a.modified);
                const dateB = parseModifiedDate(b.modified);
                return dateA - dateB;  // Sort by date in ascending order
            });
            break;

        case 'desc':
            $('.modifiedIcon').addClass('fa-arrow-down');
            sorted_files = [...filtered_files].sort((a, b) => {
                const dateA = parseModifiedDate(a.modified);
                const dateB = parseModifiedDate(b.modified);
                return dateB - dateA;  // Sort by date in descending order
            });
            break;

        default: // none → restore original order
            $('.modifiedIcon').addClass('hidden');
            sorted_files = [...filtered_files];
            break;
    }


    if (showFiles) {
        displayFiles();
    }
}

// Define the sorting function
function parseModifiedDate(dateString) {
    // Split the string into time and date parts
    const [time, date] = dateString.split(' ');

    // Split the date part into day, month, and year
    const [day, month, year] = date.split('-');

    // Reformat to 'Y-m-d H:i' which JavaScript Date object can understand
    return new Date(`${year}-${month}-${day}T${time}:00`);
}</script>
